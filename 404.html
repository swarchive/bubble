<!-- public/404.html -->
<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <script>
            ;(async function() {
            // 1) Vite의 base 설정과 일치시킬 경로
            const base = '/bubble/'
            // 2) 예: '/bubble/bydates/2025-04-12' → 'bydates/2025-04-12'
            const path = window.location.pathname.replace(base, '')
            // 3) index.html 을 불러와 문서 전체를 덮어 쓰고
            const resp = await fetch(base + 'index.html')
            const html = await resp.text()
            document.open()
            document.write(html)
            document.close()
            // 4) 히스토리 API로 URL을 원래대로 바꿔 놓기
            window.history.replaceState({}, '', base + path + window.location.search)
        })();
        </script>
    </head>
    <body></body>
</html>
